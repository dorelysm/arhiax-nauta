name: OPA Policy Bundle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OPA
        run: |
          curl --fail --location --retry 5 --retry-delay 2 -o opa https://github.com/open-policy-agent/opa/releases/download/v1.16.2/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Formatting diff
        run: opa fmt --diff policy-bundle-nauta-colombia

      - name: Static check
        run: opa check policy-bundle-nauta-colombia

      - name: Test
        run: opa test policy-bundle-nauta-colombia

      - name: Generate cryptographic keys
        run: node scripts/generate-keys.mjs

      - name: Sign OPA policies
        run: opa sign --bundle --signing-key keys/development-private.pem -o policy-bundle-nauta-colombia policy-bundle-nauta-colombia

      - name: Build bundle
        run: opa build policy-bundle-nauta-colombia -o nauta-policy-bundle.tar.gz

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Emit JSON Schemas from OpenAPI
        run: npm run schema:emit

      - name: Golden fixtures
        run: node scripts/test-fixtures.mjs

      - name: Runtime unit tests
        run: npm test

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nauta-policy-bundle
          path: nauta-policy-bundle.tar.gz
